name: Build Axiom Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip projects
        run: |
          unzip -q "axiom-client(1).zip" || unzip -q "axiom-client.zip" || true
          unzip -q "axiom-launcher(1).zip" || unzip -q "axiom-launcher.zip" || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build client mod
        working-directory: axiom-client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Stage mod into launcher
        run: |
          mkdir -p axiom-launcher/src/main/resources
          cp axiom-client/build/libs/axiomclient-1.0.0.jar axiom-launcher/src/main/resources/

      - name: Build launcher
        working-directory: axiom-launcher
        run: |
          chmod +x gradlew
          ./gradlew jar --no-daemon

      - name: Upload launcher jar
        uses: actions/upload-artifact@v4
        with:
          name: axiom-launcher
          path: axiom-launcher/build/libs/axiom-launcher-1.0.0.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Axiom Client v1.0.0 (build ${{ github.run_number }})
          files: |
            axiom-client/build/libs/axiomclient-1.0.0.jar
            axiom-launcher/build/libs/axiom-launcher-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
